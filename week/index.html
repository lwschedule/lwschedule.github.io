<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>This Week's Schedule</title>
  <link rel="icon" href="/favicon.ico">
  <link rel="apple-touch-icon" href="/icons/icon-512.png">
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#000000">
  <link rel="stylesheet" href="/common.css">
</head>
<body>
  
  <div class="pageContainer">
    <h2>This Week's Schedule</h2>
    <div id="weekContent">
      <div class="sk-table" aria-hidden="true">
        <div class="sk-table-row"><span class="skeleton sk-line" style="width:20%;"></span><span class="skeleton sk-line" style="width:60%;"></span></div>
        <div class="sk-table-row"><span class="skeleton sk-line" style="width:24%;"></span><span class="skeleton sk-line" style="width:54%;"></span></div>
        <div class="sk-table-row"><span class="skeleton sk-line" style="width:22%;"></span><span class="skeleton sk-line" style="width:58%;"></span></div>
        <div class="sk-table-row"><span class="skeleton sk-line" style="width:20%;"></span><span class="skeleton sk-line" style="width:50%;"></span></div>
        <div class="sk-table-row"><span class="skeleton sk-line" style="width:26%;"></span><span class="skeleton sk-line" style="width:62%;"></span></div>
      </div>
    </div>
  </div>
  <script src="/common-core.js"></script>
  <script>
    (async () => {
      if (typeof window.loadCommon === 'function') {
        try { await window.loadCommon(); } catch (err) { console.error('Failed to load common runtime:', err); }
      }
      await initApp();
      updateWeekSchedule();
    })();
  </script>
</body>
</html>
