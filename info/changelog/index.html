<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Changelog</title>
  <link rel="icon" href="/favicon.ico">
  <link rel="apple-touch-icon" href="/icons/icon-512.png">
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#000000">
  <link rel="stylesheet" href="/common.css">
</head>
<body>
  <div class="pageContainer">
    <h2>Changelog</h2>
    <div class="whatsnewContent">

      <div class="settingsRow">
        <a class="mainBtn" href="https://github.com/lwschedule/lwschedule.github.io/issues" target="_blank" rel="noopener">Coming Soon</a>
      </div>

      <div class="whatsnewSection">
<div class="changelog-list" id="changelogList">
        <div class="sk-changelog-list" aria-hidden="true">
          <div class="sk-changelog-item"><span class="skeleton sk-chip" style="width:72px;height:22px;"></span><span class="skeleton sk-line" style="width:60%;"></span></div>
          <div class="sk-changelog-item"><span class="skeleton sk-chip" style="width:64px;height:22px;"></span><span class="skeleton sk-line" style="width:52%;"></span></div>
          <div class="sk-changelog-item"><span class="skeleton sk-chip" style="width:70px;height:22px;"></span><span class="skeleton sk-line" style="width:64%;"></span></div>
          <div class="sk-changelog-item"><span class="skeleton sk-chip" style="width:66px;height:22px;"></span><span class="skeleton sk-line" style="width:48%;"></span></div>
          <div class="sk-changelog-item"><span class="skeleton sk-chip" style="width:72px;height:22px;"></span><span class="skeleton sk-line" style="width:56%;"></span></div>
        </div>
      </div>
      </div>
    </div>
  </div>
  <script src="/common-core.js"></script>
  <script>
    (async () => {
      if (typeof window.loadCommon === 'function') {
        try { await window.loadCommon(); } catch (err) { console.error('Failed to load common runtime:', err); }
      }
      checkSetupComplete();
      
      // Load and render changelog from JSON
      try {
        const res = await fetch('/data/changelog.json');
        const entries = await res.json();
        renderChangelog(entries);
      } catch (err) {
        console.error('Failed to load changelog:', err);
        document.getElementById('changelogList').innerHTML = '<p style="color:var(--text-muted);text-align:center;padding:20px;">Could not load version history.</p>';
      }
      
    })();

    // Show versions as v2026.8.27 (2): release count in parentheses, only when greater than one.
    function formatVersionDisplay(version) {
      const m = /^v(\d{4}\.\d+\.\d+)(?:\.(\d+))?$/.exec(version);
      if (!m) return version;
      const count = m[2] ? parseInt(m[2], 10) : 0;
      return count > 1 ? 'v' + m[1] + ' (' + count + ')' : 'v' + m[1];
    }

    function renderChangelog(entries) {
      const container = document.getElementById('changelogList');
      
      // Group entries by month-year
      const groups = [];
      let currentMonth = null;
      let currentGroup = [];
      
      // Map abbreviations to full month names so a differently formatted date can't split a month into two headings.
      const MONTH_NAMES = { Jan: 'January', Feb: 'February', Mar: 'March', Apr: 'April', May: 'May', Jun: 'June', Jul: 'July', Aug: 'August', Sep: 'September', Sept: 'September', Oct: 'October', Nov: 'November', Dec: 'December' };

      for (const entry of entries) {
        const parts = entry.date.split(' ');
        const monthName = MONTH_NAMES[parts[0]] || parts[0];
        const year = parts[2];
        const monthKey = monthName + ' ' + year;
        
        if (monthKey !== currentMonth) {
          if (currentGroup.length > 0) {
            groups.push({ month: currentMonth, items: currentGroup });
          }
          currentMonth = monthKey;
          currentGroup = [];
        }
        currentGroup.push(entry);
      }
      if (currentGroup.length > 0) {
        groups.push({ month: currentMonth, items: currentGroup });
      }
      
      // Render
      let html = '';
      let isFirst = true;
      
      for (const group of groups) {
        html += '<div class="changelog-month-heading">' + group.month + '</div>\n';
        for (const entry of group.items) {
          let anchored = isFirst ? ' changelog-row-anchored' : '';
          html += '<div class="changelog-item' + anchored + '"><span class="version-pill">' + formatVersionDisplay(entry.version) + '</span><div class="changelog-item-body"><div class="commit-title">' + entry.title + '</div></div></div>\n';
          isFirst = false;
        }
      }
      
      container.innerHTML = html;
    }
  </script>
</body>
</html>
