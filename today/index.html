<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Today's Schedule</title>
  <link rel="icon" href="/favicon.ico">
  <link rel="apple-touch-icon" href="/icons/icon-512.png">
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#000000">
  <link rel="stylesheet" href="/common.css">
</head>
<body>
  
  <div class="pageContainer">
    <h2>Today's Schedule</h2>
    <div id="todayContent">
      <div class="sk-table" aria-hidden="true">
        <div class="sk-table-row"><span class="skeleton sk-line" style="width:32%;"></span><span class="skeleton sk-line" style="width:22%;margin-left:auto;"></span></div>
        <div class="sk-table-row"><span class="skeleton sk-line" style="width:44%;"></span><span class="skeleton sk-line" style="width:18%;margin-left:auto;"></span></div>
        <div class="sk-table-row"><span class="skeleton sk-line" style="width:38%;"></span><span class="skeleton sk-line" style="width:24%;margin-left:auto;"></span></div>
        <div class="sk-table-row"><span class="skeleton sk-line" style="width:46%;"></span><span class="skeleton sk-line" style="width:20%;margin-left:auto;"></span></div>
        <div class="sk-table-row"><span class="skeleton sk-line" style="width:36%;"></span><span class="skeleton sk-line" style="width:22%;margin-left:auto;"></span></div>
        <div class="sk-table-row"><span class="skeleton sk-line" style="width:42%;"></span><span class="skeleton sk-line" style="width:18%;margin-left:auto;"></span></div>
      </div>
    </div>
  </div>
  <script src="/common-core.js"></script>
  <script>
    (async () => {
      if (typeof window.loadCommon === 'function') {
        try { await window.loadCommon(); } catch (err) { console.error('Failed to load common runtime:', err); }
      }
      await initApp();
      updateTodaySchedule();
      updateClock();
      setInterval(updateClock, 1000);

      let currentDay = getPacificNow().getDate();
      setInterval(() => {
        const now = getPacificNow();
        if (now.getDate() !== currentDay) {
          currentDay = now.getDate();
          updateTodaySchedule();
        }
      }, 60000);
    })();
  </script>
</body>
</html>
