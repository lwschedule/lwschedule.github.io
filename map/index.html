<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Map</title>
  <link rel="icon" href="/favicon.ico">
  <link rel="apple-touch-icon" href="/icons/icon-512.png">
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#000000">
  <link rel="stylesheet" href="/common.css">
</head>
<body class="mapPage">
  <div class="pageContainer">
    <h2>Map</h2>

    <!-- Search bar at the very top -->
    <div class="mapSearchWrap">
      <input id="mapSearch" class="mapSearchInput" type="search" autocomplete="off"
             placeholder="Search a room by name or number…" aria-label="Search rooms"
             role="combobox" aria-expanded="false" aria-controls="mapSearchResults" />
      <div id="mapSearchResults" class="mapSearchResults" role="listbox" aria-label="Room results" hidden></div>
      <div id="mapSearchLive" class="sr-only" aria-live="polite"></div>
    </div>

    <!-- Floor selector -->
    <div class="mapFloorRow">
      <label for="mapFloorSelect">Floor:</label>
      <select id="mapFloorSelect" class="mapFloorSelect" aria-label="Select floor">
        <option value="1st Floor">1st Floor</option>
        <option value="2nd Floor">2nd Floor</option>
        <option value="3rd Floor">3rd Floor</option>
        <option value="North 1">North 1</option>
        <option value="North 2">North 2</option>
      </select>
    </div>

    <!-- Map card -->
    <div class="mapCard">
      <div class="mapToolbar">
        <div class="mapHint">Tap a room to highlight it</div>
        <div class="mapZoomBtns">
          <button id="mapZoomOut" class="mapZoomBtn" aria-label="Zoom out">−</button>
          <button id="mapZoomReset" class="mapZoomBtn" aria-label="Reset view">⟲</button>
          <button id="mapZoomIn" class="mapZoomBtn" aria-label="Zoom in">+</button>
        </div>
      </div>
      <div class="mapViewport" id="mapViewport">
        <svg id="schoolMap" class="schoolMap" viewBox="0 0 1200 960" role="img"
             aria-label="Interactive school floor plan" preserveAspectRatio="xMidYMid meet"></svg>
      </div>
      <div id="mapStatus" class="mapStatus" role="status"></div>
    </div>
  </div>

  <script src="/common-core.js"></script>
  <script>
    (async () => {
      if (typeof window.loadCommon === 'function') {
        try { await window.loadCommon(); } catch (err) { console.error('Failed to load common runtime:', err); }
      }
      checkSetupComplete();

      // Keep skeleton placeholders visible for at least 1s on page load.
      if (typeof window.minSkeletonDelay === 'function') {
        await window.minSkeletonDelay();
      }

      initMapPage();
    })();

    function initMapPage() {
      const svg = document.getElementById('schoolMap');
      const search = document.getElementById('mapSearch');
      const resultsBox = document.getElementById('mapSearchResults');
      const live = document.getElementById('mapSearchLive');
      const status = document.getElementById('mapStatus');
      const floorSelect = document.getElementById('mapFloorSelect');
      if (!svg || !search || !floorSelect) return;

      const FLOORS = ['1st Floor', '2nd Floor', '3rd Floor', 'North 1', 'North 2'];
      const NS = 'http://www.w3.org/2000/svg';

      let rooms = [];
      let roomsById = new Map();
      let currentMatches = [];
      let activeIndex = -1;
      let mapContent = null;
      let floorGroups = {};
      let floorViews = {};   // floor -> {viewY, viewH, y0, y1}
      let currentFloor = '1st Floor';
      let viewY = 0, viewH = 1630;

      // Zoom state (transform based, within the current floor's viewBox)
      let zK = 1, zTx = 0, zTy = 0;
      const K_MIN = 1, K_MAX = 5;

      function el(tag, attrs, parent) {
        const node = document.createElementNS(NS, tag);
        for (const k in attrs) {
          if (attrs[k] === null || attrs[k] === undefined) continue;
          node.setAttribute(k, attrs[k]);
        }
        if (parent) parent.appendChild(node);
        return node;
      }

      function fontFor(w) {
        if (w >= 150) return 17;
        if (w >= 110) return 15;
        if (w >= 80) return 13;
        if (w >= 55) return 12;
        if (w >= 38) return 11;
        return 9;
      }

      function displayName(it) { return it.label || it.num || it.name; }
      function resultLabel(it) { return displayName(it) + ' — ' + it.floor; }

      function itemBottom(it) {
        if (it.t === 'text') return it.y + 8;
        if (it.t === 'arc') return it.y + it.ry;
        return it.y + (it.h || 0);
      }
      function itemTop(it) {
        if (it.t === 'text') return it.y - 24;
        if (it.t === 'arc') return it.y - it.ry;
        return it.y;
      }

      function renderInto(group, it) {
        const cx = it.x + it.w / 2;

        if (it.t === 'text') {
          el('text', { x: it.x, y: it.y, class: it.cls, 'text-anchor': 'middle' }, group).textContent = it.text;
          return;
        }
        if (it.t === 'x') {
          const g = el('g', { class: 'map-xbox' }, group);
          el('rect', { x: it.x, y: it.y, width: it.w, height: it.h }, g);
          el('line', { x1: it.x, y1: it.y, x2: it.x + it.w, y2: it.y + it.h }, g);
          el('line', { x1: it.x + it.w, y1: it.y, x2: it.x, y2: it.y + it.h }, g);
          return;
        }
        if (it.t === 'arc') {
          el('path', { d: `M ${it.x - it.rx} ${it.y} A ${it.rx} ${it.ry} 0 0 1 ${it.x + it.rx} ${it.y}`, class: 'map-arc' }, group);
          return;
        }

        // rooms and zones are interactive
        const g = el('g', {
          class: 'map-room' + (it.t === 'zone' ? ' map-zone' : ''),
          id: 'room-' + it.id,
          'data-room-id': it.id,
          tabindex: 0,
          role: 'button',
          'aria-label': resultLabel(it)
        }, group);
        const title = document.createElementNS(NS, 'title');
        title.textContent = resultLabel(it);
        g.appendChild(title);

        if (it.t === 'room') {
          el('rect', { x: it.x, y: it.y, width: it.w, height: it.h }, g);
          const cy = it.y + it.h / 2;
          const fs = it.fz || (it.tiny ? 9 : fontFor(it.w));
          if (it.vert) {
            const t = el('text', { x: cx, y: cy, class: 'map-text-v', 'font-size': fs }, g);
            t.textContent = displayName(it);
          } else if (it.sub) {
            const main = el('text', { x: cx, y: cy - 7, 'font-size': fs }, g);
            main.textContent = displayName(it);
            const sub = el('text', { x: cx, y: cy + 11, class: 'map-sub', 'font-size': 8 }, g);
            sub.textContent = it.sub;
          } else {
            const t = el('text', { x: cx, y: cy, 'dominant-baseline': 'middle', 'font-size': fs }, g);
            t.textContent = displayName(it);
          }
        } else {
          // zone: optional block outline + label text
          if (it.block) {
            el('rect', { x: it.x, y: it.y, width: it.w, height: it.h }, g);
          }
          const fz = it.fz || 15;
          const ly = it.ly || (it.y + it.h - 6);
          const t = el('text', { x: cx, y: ly, 'text-anchor': 'middle', 'font-size': fz }, g);
          t.textContent = it.name;
        }
      }

      function draw() {
        mapContent = el('g', { id: 'mapContent' }, svg);

        fetch('/data/map-rooms.json')
          .then(r => r.json())
          .then(data => {
            const items = data.items;

            // One subgroup per floor; items without a floor (page title) always show.
            for (const f of FLOORS) floorGroups[f] = el('g', { 'data-floor': f }, mapContent);

            // Bounds per floor for the per-floor viewBox.
            // Each floor is a standalone campus layout in the same coordinate space,
            // so floors are measured independently (no stacking offsets).
            const looseTop = Math.min(...items.filter(i => !i.floor && i.y !== undefined).map(itemTop), Infinity);
            for (const f of FLOORS) {
              const flItems = items.filter(i => i.floor === f);
              floorViews[f] = {
                y0: Math.min(looseTop, ...flItems.map(itemTop)),
                y1: Math.max(...flItems.map(itemBottom))
              };
            }

            // Per-floor viewBox: pad, clamped to the canvas top
            for (const f of FLOORS) {
              const b = floorViews[f];
              b.viewY = Math.max(0, b.y0 - 40);
              b.viewH = (b.y1 + 40) - b.viewY;
            }

            for (const it of items) {
              const group = it.floor ? floorGroups[it.floor] : mapContent;
              if (group) renderInto(group, it);
            }
            rooms = items.filter(i => i.t === 'room' || i.t === 'zone');
            roomsById = new Map(rooms.map(r => [r.id, r]));

            applyFloor(currentFloor);
          })
          .catch(err => {
            console.error('Failed to load map rooms:', err);
            if (status) status.textContent = 'Could not load the map data.';
          });
      }
      draw();

      // ---- Floor switching ----
      function applyFloor(f) {
        currentFloor = f;
        for (const g of Object.values(floorGroups)) g.setAttribute('display', 'none');
        if (floorGroups[f]) floorGroups[f].removeAttribute('display');
        const b = floorViews[f];
        if (b) {
          viewY = b.viewY; viewH = b.viewH;
          svg.setAttribute('viewBox', '0 ' + viewY + ' 1200 ' + viewH);
        }
        zK = 1; zTx = 0; zTy = 0; applyZoom();
      }

      floorSelect.addEventListener('change', () => {
        clearHighlight();
        if (status) status.textContent = '';
        applyFloor(floorSelect.value);
      });

      // ---- Selection / highlight (purple) ----
      function clearHighlight() {
        svg.querySelectorAll('.map-room.selected').forEach(n => n.classList.remove('selected'));
      }

      function selectRoom(roomId, fromSearch) {
        clearHighlight();
        const room = roomsById.get(roomId);
        if (!room) return;
        // Searching a room on another floor switches to that floor automatically
        if (room.floor && room.floor !== currentFloor) {
          floorSelect.value = room.floor;
          applyFloor(room.floor);
        }
        const node = document.getElementById('room-' + roomId);
        if (!node) return;
        node.classList.add('selected');
        if (status) status.textContent = 'Selected: ' + resultLabel(room);
        if (fromSearch) hideResults();
        try { node.scrollIntoView({ block: 'center', behavior: 'smooth' }); } catch (e) {}
      }

      svg.addEventListener('click', (e) => {
        const g = e.target.closest('.map-room');
        if (g && g.dataset.roomId) selectRoom(g.dataset.roomId, false);
      });
      svg.addEventListener('keydown', (e) => {
        if (e.key !== 'Enter' && e.key !== ' ') return;
        const g = e.target.closest('.map-room');
        if (g && g.dataset.roomId) {
          e.preventDefault();
          selectRoom(g.dataset.roomId, false);
        }
      });

      // ---- Zoom & pan (transform based, within the current floor's viewBox) ----
      function applyZoom() {
        if (mapContent) mapContent.setAttribute('transform', 'translate(' + zTx + ' ' + zTy + ') scale(' + zK + ')');
      }

      function clampPan() {
        const b = floorViews[currentFloor];
        if (!b) { zTx = 0; zTy = 0; return; }
        zTx = Math.min(0, Math.max(1200 - 1200 * zK, zTx));
        if (zK === 1) { zTy = 0; return; }
        zTy = Math.min(Math.max(zTy, viewY + viewH - b.y1 * zK), viewY - b.y0 * zK);
      }

      function zoomTo(k1, cx, cy) {
        k1 = Math.min(K_MAX, Math.max(K_MIN, k1));
        zTx = zTx + (zK - k1) * cx;
        zTy = zTy + (zK - k1) * cy;
        zK = k1;
        clampPan();
        applyZoom();
      }

      function resetView() { zK = 1; zTx = 0; zTy = 0; applyZoom(); }

      document.getElementById('mapZoomIn').addEventListener('click', () => {
        const c = { x: (600 - zTx) / zK, y: (viewY + viewH / 2 - zTy) / zK };
        zoomTo(zK * 1.3, c.x, c.y);
      });
      document.getElementById('mapZoomOut').addEventListener('click', () => {
        const c = { x: (600 - zTx) / zK, y: (viewY + viewH / 2 - zTy) / zK };
        zoomTo(zK / 1.3, c.x, c.y);
      });
      document.getElementById('mapZoomReset').addEventListener('click', resetView);

      function clientToUser(cx, cy) {
        const rect = svg.getBoundingClientRect();
        const vu = (cx - rect.left) / rect.width * 1200;
        const vh = viewY + (cy - rect.top) / rect.height * viewH;
        return { x: (vu - zTx) / zK, y: (vh - zTy) / zK };
      }

      svg.addEventListener('wheel', (e) => {
        e.preventDefault();
        const c = clientToUser(e.clientX, e.clientY);
        zoomTo(zK * (e.deltaY > 0 ? 1.12 : 0.89), c.x, c.y);
      }, { passive: false });

      let dragging = false, dragStart = null, viewStart = null;
      svg.addEventListener('pointerdown', (e) => {
        if (e.button !== 0) return;
        dragging = true;
        dragStart = { x: e.clientX, y: e.clientY };
        viewStart = { k: zK, tx: zTx, ty: zTy };
        svg.setPointerCapture(e.pointerId);
      });
      svg.addEventListener('pointermove', (e) => {
        if (!dragging) return;
        const rect = svg.getBoundingClientRect();
        const du = ((e.clientX - dragStart.x) / rect.width) * 1200;
        const dv = ((e.clientY - dragStart.y) / rect.height) * viewH;
        zK = viewStart.k;
        zTx = viewStart.tx - du;
        zTy = viewStart.ty - dv;
        clampPan();
        applyZoom();
      });
      ['pointerup', 'pointercancel'].forEach(ev => svg.addEventListener(ev, () => { dragging = false; }));

      // ---- Search ----
      function hideResults() {
        resultsBox.hidden = true;
        search.setAttribute('aria-expanded', 'false');
        activeIndex = -1;
      }
      function showResults() {
        resultsBox.hidden = false;
        search.setAttribute('aria-expanded', 'true');
      }
      function announce(text) { if (live) live.textContent = text; }

      function doSearch(q) {
        const query = q.trim().toLowerCase();
        if (!query) { currentMatches = []; hideResults(); return; }
        currentMatches = rooms.filter(r => {
          const hay = ((r.num || '') + ' ' + r.name + ' ' + (r.aliases || []).join(' ') + ' ' + r.floor).toLowerCase();
          return hay.includes(query);
        }).slice(0, 8);
        activeIndex = -1;
        renderResults();
        announce(currentMatches.length + (currentMatches.length === 1 ? ' room found' : ' rooms found'));
      }

      function renderResults() {
        if (!currentMatches.length) {
          resultsBox.innerHTML = '<div class="mapSearchEmpty">No rooms found</div>';
          showResults();
          return;
        }
        resultsBox.innerHTML = currentMatches.map((r, i) =>
          '<div class="mapSearchItem" role="option" data-id="' + r.id + '" aria-selected="' + (i === activeIndex) + '">' +
          '<span class="mapSearchName">' + resultLabel(r) + '</span></div>'
        ).join('');
        showResults();
      }

      search.addEventListener('input', () => doSearch(search.value));

      search.addEventListener('keydown', (e) => {
        if (resultsBox.hidden) return;
        const items = resultsBox.querySelectorAll('.mapSearchItem');
        if (!items.length) return;
        if (e.key === 'ArrowDown') {
          e.preventDefault();
          activeIndex = (activeIndex + 1) % items.length;
          updateActive(items);
        } else if (e.key === 'ArrowUp') {
          e.preventDefault();
          activeIndex = (activeIndex - 1 + items.length) % items.length;
          updateActive(items);
        } else if (e.key === 'Enter') {
          e.preventDefault();
          pickMatch(currentMatches[activeIndex >= 0 ? activeIndex : 0]);
        } else if (e.key === 'Escape') {
          hideResults();
        }
      });

      function updateActive(items) {
        items.forEach((el2, i) => el2.setAttribute('aria-selected', i === activeIndex));
        if (items[activeIndex]) items[activeIndex].scrollIntoView({ block: 'nearest' });
      }

      function pickMatch(match) {
        if (!match) return;
        selectRoom(match.id, true);
        search.value = displayName(match);
        hideResults();
      }

      resultsBox.addEventListener('click', (e) => {
        const item = e.target.closest('.mapSearchItem');
        if (!item) return;
        pickMatch(currentMatches.find(r => r.id === item.dataset.id));
      });

      document.addEventListener('click', (e) => {
        if (!e.target.closest('.mapSearchWrap')) hideResults();
      });
    }
  </script>
</body>
</html>
